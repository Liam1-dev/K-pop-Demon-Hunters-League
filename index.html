<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends Client - K-pop Edition</title>
    <!-- Tailwind CSS for high-fidelity UI layout mapping -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        
        body {
            font-family: 'Spiegel', sans-serif;
            background-color: #010a13; /* Classic LoL Deep Indigo Charcoal */
            background-image: radial-gradient(circle at center, #0a1428 0%, #010a13 100%);
        }
        .lol-title-font {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
        }
        /* Strict global override for deep contrast absolute white typography */
        *, p, span, h1, h2, h3, div, input, button, select {
            color: #ffffff !important;
        }
    </style>
</head>
<body class="min-h-screen select-none pb-12">

    <!-- Official LoL Global Navigation Bar -->
    <header class="bg-[#010a13] border-b border-[#785a28] px-6 py-2 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-8">
            <!-- Riot Logo / Client Icon -->
            <div class="border border-[#785a28] p-1.5 rounded-sm bg-[#0a1428] hover:border-[#c89b3c] transition cursor-pointer">
                <span class="text-xl font-bold tracking-tighter">L</span>
            </div>
            <!-- Main Client Tabs -->
            <nav class="flex gap-6 text-xs font-bold uppercase tracking-wider h-full pt-1">
                <span class="border-b-2 border-[#c89b3c] pb-2 cursor-pointer">PLAY</span>
                <span class="opacity-50 hover:opacity-100 transition pb-2 cursor-pointer">HOME</span>
                <span class="opacity-50 hover:opacity-100 transition pb-2 cursor-pointer">PROFILE</span>
                <span class="text-[#c89b3c] border-b-2 border-transparent hover:border-[#c89b3c] pb-2 cursor-pointer">CHAMPIONS</span>
                <span class="opacity-50 hover:opacity-100 transition pb-2 cursor-pointer">LOOT</span>
                <span class="opacity-50 hover:opacity-100 transition pb-2 cursor-pointer">STORE</span>
            </nav>
        </div>

        <!-- Summoner Card Info Block -->
        <div class="flex items-center gap-4 text-xs font-bold bg-[#010a13] border border-[#32281e] px-4 py-1.5 rounded">
            <div class="text-right">
                <p id="sum-name" class="text-sm font-bold tracking-wide">Summoner</p>
                <p id="sum-tier" class="font-mono text-[10px] tracking-widest opacity-80">UNRANKED — 0 LP</p>
            </div>
            <div class="h-6 w-[1px] bg-[#32281e]"></div>
            <div class="flex items-center gap-1.5">
                <span>🪙</span>
                <div>
                    <p class="text-[9px] uppercase font-mono opacity-60">Gold Coins</p>
                    <p id="sum-gold" class="font-mono font-bold text-sm">500</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main LoL Client Roster Grid Grid -->
    <main class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Left Side Control Panel: Summoner Profile Settings, Selection and Shop Slots -->
        <div class="lg:col-span-1 space-y-4">
            
            <!-- Summoner Client Credentials Configuration Card -->
            <div class="bg-[#091428] border border-[#1e2328] p-4 rounded shadow-md">
                <h2 class="text-[10px] font-bold uppercase mb-2 font-mono tracking-wider opacity-70">Client Configuration</h2>
                <div class="flex gap-2">
                    <input id="summoner-input" type="text" maxlength="16" placeholder="Summoner Name..." class="bg-[#010a13] border border-[#463d2e] rounded px-3 py-1.5 text-xs w-full focus:outline-none focus:border-[#785a28]">
                    <button onclick="updateSummonerName()" class="bg-[#11b6cd] text-black font-black uppercase text-[10px] px-3 py-1.5 rounded transition hover:bg-[#16d6f0] cursor-pointer">Save</button>
                </div>
            </div>

            <!-- Champion Drafting Cell -->
            <div class="bg-[#091428] border border-[#785a28] p-4 rounded shadow-md">
                <h2 class="text-xs font-bold uppercase lol-title-font border-b border-[#32281e] pb-2 mb-3 tracking-wide">Champion Select</h2>
                <div class="space-y-2.5">
                    <!-- Rumi -->
                    <div id="champ-Rumi" onclick="lockChampion('Rumi')" class="bg-[#010a13] border border-[#32281e] p-3 rounded cursor-pointer transition hover:border-[#c89b3c]">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-sm tracking-wide">Rumi</span>
                            <span class="text-[9px] bg-[#2b1a0a] border border-red-500/30 px-2 py-0.5 rounded font-black uppercase">Assassin</span>
                        </div>
                        <p class="text-[11px] mt-1 font-mono opacity-70">Q: Phantom Drop (Burst Strike)</p>
                    </div>

                    <!-- Jinu -->
                    <div id="champ-Jinu" onclick="lockChampion('Jinu')" class="bg-[#010a13] border border-[#32281e] p-3 rounded cursor-pointer transition hover:border-[#c89b3c]">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-sm tracking-wide">Jinu</span>
                            <span class="text-[9px] bg-[#0a1a2e] border border-cyan-500/30 px-2 py-0.5 rounded font-black uppercase">Mage</span>
                        </div>
                        <p class="text-[11px] mt-1 font-mono opacity-70">W: Encore Barrier (Shielding)</p>
                    </div>
                </div>
            </div>

            <!-- Summoner Battle Spells Configurator -->
            <div class="bg-[#091428] border border-[#1e2328] p-4 rounded shadow-md">
                <h2 class="text-[10px] font-bold uppercase border-b border-[#32281e] pb-1.5 mb-2 font-mono tracking-wider opacity-70">Summoner Spells</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="spell-Flash" onclick="selectSpell('Flash')" class="bg-[#010a13] border border-[#32281e] p-2 rounded text-center text-xs font-bold hover:border-[#c89b3c] cursor-pointer">🟡 Flash</button>
                    <button id="spell-Ignite" onclick="selectSpell('Ignite')" class="bg-[#010a13] border border-[#32281e] p-2 rounded text-center text-xs font-bold hover:border-[#c89b3c] cursor-pointer">🔥 Ignite</button>
                </div>
            </div>

            <!-- Hextech Classic Shop Terminal -->
            <div class="bg-[#091428] border border-[#785a28] p-4 rounded shadow-md">
                <h2 class="text-xs font-bold uppercase lol-title-font border-b border-[#32281e] pb-2 mb-3 tracking-wide">Item Shop</h2>
                <div class="space-y-2">
                    <button onclick="buyItem('DoransBlade', 450)" class="w-full text-left bg-[#010a13] border border-[#32281e] hover:border-[#c89b3c] p-2 rounded flex justify-between items-center text-xs cursor-pointer transition">
                        <div>
                            <p class="font-bold">⚔️ Doran's Blade</p>
                            <p class="font-mono text-[10px] opacity-60">+15 Attack Damage</p>
                        </div>
                        <span class="font-bold font-mono text-yellow-500">450g</span>
                    </button>
                    <button onclick="buyItem('Rabadons', 1200)" class="w-full text-left bg-[#010a13] border border-[#32281e] hover:border-[#c89b3c] p-2 rounded flex justify-between items-center text-xs cursor-pointer transition">
                        <div>
                            <p class="font-bold">🎩 Rabadon's Deathcap</p>
                            <p class="font-mono text-[10px] opacity-60">+40 Skill AP Power</p>
                        </div>
                        <span class="font-bold font-mono text-yellow-500">1200g</span>
                    </button>
                </div>
                <div class="mt-3 pt-2 border-t border-[#1e2328]">
                    <p class="text-[10px] font-mono opacity-80">Inventory Slots: <span id="inventory-list" class="font-sans font-bold text-white">None</span></p>
                </div>
            </div>

        </div>

        <!-- Center & Right Column: Summoner's Rift Map Core Monitor HUD -->
        <div class="lg:col-span-3 space-y-6">
            
            <!-- Summoner's Rift HUD Arena Interface -->
            <div class="bg-[#091428] border-2 border-[#785a28] p-6 rounded shadow-2xl relative overflow-hidden">
                <div class="flex justify-between items-center mb-6 border-b border-[#32281e] pb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
                        <h2 class="text-xs uppercase font-mono tracking-widest font-black">SUMMONER'S RIFT MATCHGROUND</h2>
                    </div>
                    <!-- Match Confirmation Search Trigger Button -->
                    <button onclick="queueUpMatch()" class="bg-gradient-to-b from-[#1e2328] to-[#11b6cd] text-black font-black uppercase text-xs px-8 py-2.5 border border-[#785a28] rounded shadow-lg cursor-pointer tracking-widest">
                        FIND MATCH
                    </button>
                </div>

                <!-- Tactical Grid Display -->
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                    
                    <!-- Allied Side Champion Unit Node -->
